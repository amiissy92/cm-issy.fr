<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e4538">
  <title>Site en maintenance — Centre Musulman d’Issy-les-Moulineaux</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: #193b32;
      background: #f5f7f2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 15%, #e1eee5 0, transparent 38%),
        radial-gradient(ellipse at 90% 85%, #e8eee1 0, transparent 35%),
        #f7f8f4;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e6ebe4;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(27, 62, 49, 0.09);
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 28px;
    }

    .logo-fallback {
      width: 120px;
      height: 120px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #0e4538;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #54806c;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #123d32;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.12;
    }

    .message {
      max-width: 490px;
      margin: 20px auto 0;
      color: #5b6d64;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .ornament {
      width: 54px;
      height: 3px;
      margin: 28px auto;
      border-radius: 2px;
      background: #c49a52;
    }

    .signature {
      margin: 0;
      color: #294d40;
      font-weight: 600;
    }

    .facebook-link {
      display: inline-block;
      margin-top: 24px;
      color: #54806c;
      font-size: 0.92rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <a
      href="https://www.facebook.com/photo/?fbid=466954465474185&amp;set=a.466954422140856&amp;locale=fr_FR"
      aria-label="Voir le logo du Centre Musulman sur Facebook"
    >
      <img
        class="logo"
        src="assets/logo.png"
        alt="Logo du Centre Musulman d’Issy-les-Moulineaux"
        onerror="this.hidden = true; document.getElementById('logo-fallback').hidden = false;"
      >
    </a>
    <div class="logo-fallback" id="logo-fallback" hidden>CMI</div>

    <p class="eyebrow">Centre Musulman d’Issy-les-Moulineaux</p>
    <h1>Notre site fait peau neuve</h1>
    <div class="ornament" aria-hidden="true"></div>

    <p class="message">
      Nous effectuons actuellement une maintenance afin de mieux vous accueillir.
      Le site revient bientôt. Merci de votre patience et à très vite&nbsp;!
    </p>

    <p class="signature">L’équipe du Centre Musulman</p>

    <a
      class="facebook-link"
      href="https://www.facebook.com/cmissy92/?locale=fr_FR"
      target="_blank"
      rel="noopener noreferrer"
    >
      Retrouver notre page sur Facebook
    </a>
  </main>
</body>
</html>
